# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      # Build with:
      # 1. GCC on Linux
      # 2. Clang on Linux
      # 3. MSVC on Windows
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]

        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

        exclude:
          - os: windows-latest
            c_compiler: gcc

          - os: windows-latest
            c_compiler: clang

          - os: ubuntu-latest
            c_compiler: cl

    steps:
    # SDL is stored as a Git submodule, so clone it too.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # SDL needs desktop/windowing development libraries when being built
    # from source on the clean Ubuntu runner.
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxi-dev \
          libxfixes-dev \
          libxss-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libxtst-dev
    # Windows MVSC
    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # Ninja is already available on GitHub's Windows runner,
    # but verify that it exists before configuring.
    - name: Check Ninja
      run: ninja --version

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # Mirrors:
    #
    # cmake -S . -B build -G Ninja
    #
    # from build.sh, while explicitly selecting the compiler used
    # by each CI matrix entry.
    - name: Configure CMake
      run: >
        cmake
        -S ${{ github.workspace }}
        -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    # Mirrors:
    #
    # cmake --build build
    #
    # from build.sh.
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }}

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: particle-garden-${{ matrix.os }}-${{ matrix.c_compiler }}
        path: |
          build/particle-garden
          build/particle-garden.exe
          build/lib/SDL/SDL3.dll
        if-no-files-found: ignore
